<script>
/* ================================================================
   ERROR LOGGING & STATE
   ================================================================ */
function showError(msg) {
  const b = document.getElementById('errorBanner');
  const m = document.getElementById('errorMessage');
  if (b && m) {
    m.textContent = msg;
    b.classList.remove('hidden');
  }
}
window.addEventListener('error', e => showError(`Runtime Error: ${e.message} (Line ${e.lineno})`));
window.addEventListener('unhandledrejection', e => showError(`Unhandled Promise: ${e.reason?.message || e.reason}`));

const safeStorage = {
  getItem: (k) => { try { return localStorage.getItem(k); } catch(e) { return null; } },
  setItem: (k, v) => { try { localStorage.setItem(k, v); } catch(e) {} }
};

const PRESETS_LIVE = {
  unified: { label: "HTML + CSS + JS Unified", code: `<!DOCTYPE html>\n<html>\n<head>\n<style>body{font-family:sans-serif;background:#0f172a;color:white;text-align:center;padding:2rem}</style>\n</head>\n<body>\n<h1>Hello World</h1>\n<button onclick="alert('Clicked!')">Click me</button>\n</body>\n</html>` },
};

const IDE_STARTERS = {
  python: `print("Hello Python")\n`,
  javascript: `console.log("Hello JS");\n`,
  markdown: `# Markdown Test\n\nThis is **bold**.\n`
};

const JUDGE0_API_URL = 'https://ce.judge0.com/submissions?wait=true&base64_encoded=false';
const JUDGE0_LANGUAGES = { python: { id: 71 }, javascript: { id: 63 } };
const MODE_MAPPINGS = { python: 'python', javascript: 'javascript', markdown: 'markdown' };

let editor = null;
let debounceTimer;
let consoleCount = 0;
let isHorizontalLayout = false;
let isConsoleCollapsed = false;
let currentFontSize = 13.5;

let appMode = 'live';
let liveViewMode = 'single';
let liveCodeCache = PRESETS_LIVE.unified.code;
let activeIdeLanguage = 'python';
let ideCodeStore = { ...IDE_STARTERS };

// Snapshot for Diff Viewer
let codeSnapshot = liveCodeCache;

window.addEventListener('DOMContentLoaded', async () => {
  try {
    initEditor();
    setupSplitters();
    setupEventListeners();
    loadStorage();
    updatePreview();
    updateModeUi();
    
    let rt;
    window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (editor) editor.refresh(); }, 150); });
  } catch (err) { showError("Initialization failed: " + err.message); }
});

/* ================================================================
   EDITOR & BRACKET HIGHLIGHTING
   ================================================================ */
function initEditor() {
  const container = document.getElementById('editorContainer');
  
  editor = CodeMirror(container, {
    value: liveCodeCache,
    mode: 'htmlmixed',
    theme: 'dracula',
    lineNumbers: true,
    autoCloseTags: true,
    autoCloseBrackets: true,
    matchBrackets: true,
    styleActiveLine: true,
    tabSize: 2,
    indentUnit: 2,
    lineWrapping: true,
    autofocus: true,
    extraKeys: { "Ctrl-Space": "autocomplete" }
  });

  // --- BRACKET BLOCK HIGHLIGHTING LOGIC ---
  editor.on("cursorActivity", function(cm) {
    // 1. Clear existing highlights
    cm.eachLine(line => cm.removeLineClass(line, 'background', 'cm-bracket-highlight'));
    
    const cur = cm.getCursor();
    const lineText = cm.getLine(cur.line);
    if (!lineText) return;

    // 2. Find matching bracket from the current cursor position
    const match = cm.findMatchingBracket(cur);
    
    if (match && match.match) {
      const startLine = Math.min(cur.line, match.to.line);
      const endLine = Math.max(cur.line, match.to.line);
      
      // 3. Highlight all lines between the brackets
      for (let i = startLine; i <= endLine; i++) {
        cm.addLineClass(i, 'background', 'cm-bracket-highlight');
      }
    }
  });

  editor.on('cursorActivity', cm => {
    const p = cm.getCursor();
    document.getElementById('cursorPos').innerText = `Ln ${p.line + 1}, Col ${p.ch + 1}`;
  });

  editor.on('change', () => {
    if (appMode === 'live') {
      liveCodeCache = editor.getValue();
      saveStorage();
      if (document.getElementById('autoRunToggle')?.checked) schedulePreviewUpdate();
    } else {
      ideCodeStore[activeIdeLanguage] = editor.getValue();
      saveStorage();
    }
  });
}

/* ================================================================
   DIFF LOGIC
   ================================================================ */
document.getElementById('diffBtn').addEventListener('click', () => {
  const currentCode = editor.getValue();
  
  if (codeSnapshot === currentCode) {
    showToast('No changes since last snapshot', 'info');
    return;
  }

  const diff = Diff.diffLines(codeSnapshot, currentCode);
  const output = document.getElementById('diffOutput');
  output.innerHTML = '';

  diff.forEach((part) => {
    const lines = part.value.split('\n');
    if (lines[lines.length - 1] === '') lines.pop(); // Remove trailing empty line

    lines.forEach(line => {
      const div = document.createElement('div');
      div.className = 'diff-line';
      
      if (part.added) {
        div.classList.add('diff-added');
        div.textContent = '+ ' + line;
      } else if (part.removed) {
        div.classList.add('diff-removed');
        div.textContent = '- ' + line;
      } else {
        div.classList.add('diff-neutral');
        div.textContent = '  ' + line;
      }
      output.appendChild(div);
    });
  });

  document.getElementById('diffModal').classList.replace('hidden', 'flex');
});

document.getElementById('closeDiffBtn').addEventListener('click', () => {
  document.getElementById('diffModal').classList.replace('flex', 'hidden');
});

/* ================================================================
   PREVIEW & RUN
   ================================================================ */
function schedulePreviewUpdate() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updatePreview, 600);
}

function updatePreview() {
  if (!editor) return;
  
  // Take snapshot when preview is updated (Run)
  if (appMode === 'live') {
    codeSnapshot = editor.getValue(); 
  }

  if (appMode === 'ide') {
    if (activeIdeLanguage === 'markdown') {
      const html = `<!DOCTYPE html><html><head><style>body{font-family:system-ui,sans-serif;padding:2rem;line-height:1.6;color:#e2e8f0;background:#0f172a}</style></head><body>${marked.parse(editor.getValue())}</body></html>`;
      document.getElementById('previewIframe').srcdoc = html;
      return;
    }
    setPreviewPlaceholder();
    return;
  }
  
  let html = editor.getValue();
  if (!html.trim()) html = '<body style="background:#fff"></body>';
  
  html = injectInterceptor(html);
  document.getElementById('previewIframe').srcdoc = html;
  
  document.getElementById('statusBadge').innerText = 'Live';
  document.getElementById('statusBadge').className = 'text-[10px] text-green-400 bg-green-950/60 px-2 py-1 rounded border border-green-800 font-mono';
  showToast('Snapshot taken. You can now view diffs.');
}

function injectInterceptor(html) {
  const interceptor = `<script>
(function(){
  function safeStr(o){
    const seen = new WeakSet();
    try { return JSON.stringify(o, function(k, v){ if (typeof v === 'object' && v !== null) { if (seen.has(v)) return '[Circular]'; seen.add(v); } return v; }); } 
    catch(_) { return String(o); }
  }
  function send(type, args){
    try {
      const msg = Array.from(args).map(a => (typeof a === 'object' && a !== null) ? safeStr(a) : String(a)).join(' ');
      parent.postMessage({ type:'CONSOLE_LOG', logType:type, message:msg }, '*');
    } catch(_) {}
  }
  ['log','info','warn','error'].forEach(t => {
    const orig = console[t];
    console[t] = function(){ send(t, arguments); orig.apply(console, arguments); };
  });
  window.addEventListener('error', e => {
    send('error', [e.message + ' (Line ' + e.lineno + ')\\n' + (e.error && e.error.stack ? e.error.stack : '')]);
  });
  window.addEventListener('unhandledrejection', e => {
    const r = e.reason;
    send('error', ['Unhandled: ' + (r && r.message ? r.message : r)]);
  });
  window.addEventListener('message', e => {
    if (e.data && e.data.type === 'EVAL_CODE') {
      try { const res = eval(e.data.code); if (res !== undefined) send('log', ['[REPL] ' + (typeof res === 'object' ? safeStr(res) : res)]); } 
      catch (err) { send('error', ['[REPL Error] ' + err.message]); }
    }
  });
})();
<\/script>`;
  if (html.includes('</head>')) return html.replace('</head>', interceptor + '</head>');
  if (/<body[^>]*>/i.test(html)) return html.replace(/<body[^>]*>/i, m => m + interceptor);
  return '<!DOCTYPE html>' + interceptor + html;
}

function setPreviewPlaceholder() {
  document.getElementById('previewIframe').srcdoc = `<body style="margin:0;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#0f172a;color:#64748b"><h2>Click Run to Execute</h2></body>`;
}

/* ================================================================
   UI LOGIC & EVENT LISTENERS
   ================================================================ */
function setupEventListeners() {
  const attach = (id, ev, fn) => { const el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };

  attach('runBtn', 'click', () => { if (appMode === 'live') updatePreview(); else runIdeCode(); });
  
  // REPL
  attach('replInput', 'keydown', e => {
    if (e.key === 'Enter') {
      const code = e.target.value.trim();
      if (!code) return;
      e.target.value = '';
      appendConsoleLog('system', `> ${code}`);
      document.getElementById('previewIframe').contentWindow.postMessage({ type: 'EVAL_CODE', code }, '*');
    }
  });

  // Language Switcher
  attach('ideLanguageSelect', 'change', e => {
    ideCodeStore[activeIdeLanguage] = editor.getValue();
    activeIdeLanguage = e.target.value;
    editor.setOption('mode', MODE_MAPPINGS[activeIdeLanguage]);
    editor.setValue(ideCodeStore[activeIdeLanguage] || IDE_STARTERS[activeIdeLanguage] || '');
    if (activeIdeLanguage === 'markdown') updatePreview();
  });

  // Mode Switcher
  attach('modeLiveBtn', 'click', () => {
    if (appMode === 'live') return;
    ideCodeStore[activeIdeLanguage] = editor.getValue();
    appMode = 'live';
    editor.setOption('mode', 'htmlmixed');
    editor.setValue(liveCodeCache);
    updateModeUi(); updatePreview();
  });
  
  attach('modeIdeBtn', 'click', () => {
    if (appMode === 'ide') return;
    liveCodeCache = editor.getValue();
    appMode = 'ide';
    editor.setOption('mode', MODE_MAPPINGS[activeIdeLanguage]);
    editor.setValue(ideCodeStore[activeIdeLanguage] || IDE_STARTERS[activeIdeLanguage] || '');
    updateModeUi(); setPreviewPlaceholder();
  });

  // Settings Menu
  const sMenu = document.getElementById('editorSettingsMenu');
  attach('editorSettingsBtn', 'click', (e) => { e.stopPropagation(); sMenu.classList.toggle('hidden'); });
  document.addEventListener('click', (e) => { if (!sMenu.contains(e.target)) sMenu.classList.add('hidden'); });
  
  attach('nukeBtn', 'click', () => { if(confirm('Clear all data?')) { safeStorage.setItem('studio_v3',''); location.reload(); } });
  
  attach('wrapToggle', 'change', e => editor.setOption('lineWrapping', e.target.checked));
  attach('fontIncBtn', 'click', () => { currentFontSize += 1; document.querySelector('.CodeMirror').style.fontSize = currentFontSize + 'px'; editor.refresh(); });
  attach('fontDecBtn', 'click', () => { currentFontSize -= 1; document.querySelector('.CodeMirror').style.fontSize = currentFontSize + 'px'; editor.refresh(); });

  // Console
  attach('clearConsoleBtn', 'click', () => { document.getElementById('consoleOutput').innerHTML = ''; });
}

function updateModeUi() {
  const isLive = appMode === 'live';
  document.getElementById('modeLiveBtn').className = isLive ? 'px-4 py-1.5 text-xs font-semibold rounded-md bg-accent text-white transition shadow flex items-center space-x-2' : 'px-4 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition flex items-center space-x-2';
  document.getElementById('modeIdeBtn').className = !isLive ? 'px-4 py-1.5 text-xs font-semibold rounded-md bg-indigo-500 text-white transition shadow flex items-center space-x-2' : 'px-4 py-1.5 text-xs font-semibold rounded-md text-slate-400 hover:text-slate-200 transition flex items-center space-x-2';
  document.getElementById('ideLangSelectorContainer').classList.toggle('hidden', isLive);
  document.getElementById('liveSubToggle').style.display = isLive ? 'flex' : 'none';
  document.getElementById('modeBadge').innerHTML = isLive ? `<i class="fa-solid fa-code text-accent"></i><span>Live Preview</span>` : `<i class="fa-solid fa-laptop-code text-indigo-400"></i><span>IDE</span>`;
}

function appendConsoleLog(type, message) {
  const out = document.getElementById('consoleOutput');
  if (out.children.length === 1 && out.children[0].classList.contains('italic')) out.innerHTML = '';
  
  const entry = document.createElement('div');
  entry.className = 'console-entry flex items-start space-x-2 py-1 border-b border-border/30';
  
  let color = 'text-slate-300';
  let icon = 'fa-circle-info text-sky-400';
  if (type === 'error') { color = 'text-red-300'; icon = 'fa-circle-xmark text-red-500'; }
  if (type === 'warn') { color = 'text-yellow-300'; icon = 'fa-triangle-exclamation text-yellow-500'; }
  
  entry.innerHTML = `<i class="fa-solid ${icon} mt-0.5 shrink-0"></i><span class="${color} break-all whitespace-pre-wrap">${escapeHtml(String(message))}</span>`;
  out.appendChild(entry);
  out.scrollTop = out.scrollHeight;
}

window.addEventListener('message', e => {
  if (e.data && e.data.type === 'CONSOLE_LOG') appendConsoleLog(e.data.logType, e.data.message);
});

function showToast(msg, type='info') {
  const el = document.createElement('div');
  el.className = `toast fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-xs font-semibold shadow-xl z-[300] ${type === 'error' ? 'bg-red-600 text-white' : 'bg-accent text-white'}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function escapeHtml(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

/* SPLITTERS */
function setupSplitters() {
  const p = document.getElementById('primarySplitter'), main = document.getElementById('mainContainer'), ep = document.getElementById('editorPanel'), pp = document.getElementById('previewPanel');
  let isDrag = false;
  p.addEventListener('mousedown', e => {
    if (e.target.closest('button')) return;
    isDrag = true; p.classList.add('dragging'); document.body.classList.add('dragging-active');
    document.getElementById('iframeOverlay').classList.remove('hidden');
    document.body.style.cursor = isHorizontalLayout ? 'row-resize' : 'col-resize';
  });
  window.addEventListener('mousemove', e => {
    if (!isDrag) return;
    const rect = main.getBoundingClientRect();
    if (!isHorizontalLayout) {
      let pct = ((e.clientX - rect.left) / rect.width) * 100;
      if (pct < 5) pct = 0; if (pct > 95) pct = 100;
      ep.style.width = pct + '%'; pp.style.width = (100 - pct) + '%';
    } else {
      let pct = ((e.clientY - rect.top) / rect.height) * 100;
      if (pct < 5) pct = 0; if (pct > 95) pct = 100;
      ep.style.height = pct + '%'; pp.style.height = (100 - pct) + '%';
    }
    if (editor) editor.refresh();
  });
  window.addEventListener('mouseup', () => {
    if (!isDrag) return; isDrag = false; p.classList.remove('dragging');
    document.body.classList.remove('dragging-active');
    document.getElementById('iframeOverlay').classList.add('hidden');
    document.body.style.cursor = 'default';
  });
}
</script>
